[project]
name = "pp-calendar"
version = "1.0.0"
description = "Private, day-precision calendar for PP"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pillow==12.3.0",
  "pillow-heif==1.7.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
